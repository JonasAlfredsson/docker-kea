server {
    # Listen to port 443 on both IPv4 and IPv6.
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    # Domain names this server should respond to.
    server_name localhost 127.0.0.1;

    # Load the certificate files.
    ssl_certificate         /etc/letsencrypt/live/kea-test/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/kea-test/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/kea-test/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    location /dhcp4 {
        auth_basic "Kea DHCP API";
        auth_basic_user_file /etc/nginx/user_conf.d/htpasswd;
        proxy_pass http://127.0.0.1:8084/;
    }
    location /dhcp6 {
        auth_basic "Kea DHCP API";
        auth_basic_user_file /etc/nginx/user_conf.d/htpasswd;
        proxy_pass http://127.0.0.1:8086/;
    }
}
