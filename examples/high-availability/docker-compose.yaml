# This is an advanced setup which starts two instances of the IPv4 Kea DHCP
# service with dedicated mutual TLS listeners for peer communication.
#
# IMPORTANT: Generate credentials first with `sudo bash create_certs.sh`
services:
  dhcp-1:
    image: jonasal/kea-dhcp4:3
    restart: unless-stopped
    ports:
      - 8081:8084
    environment:
      - THIS_SERVER_NAME=dhcp-1
    command: -c /kea/config/dhcp4.json
    volumes:
      - ./entrypoint.d:/entrypoint.d:ro
      - ./config:/kea/config:ro
      - ./tls/ca.crt:/kea/ca.crt:ro
      - ./tls/dhcp-1:/kea/tls:ro
      - leases-1:/kea/leases
    networks:
      kea-testing:
        ipv4_address: 10.10.10.2

  dhcp-2:
    image: jonasal/kea-dhcp4:3
    restart: unless-stopped
    ports:
      - 8082:8084
    environment:
      - THIS_SERVER_NAME=dhcp-2
    command: -c /kea/config/dhcp4.json
    volumes:
      - ./entrypoint.d:/entrypoint.d:ro
      - ./config:/kea/config:ro
      - ./tls/ca.crt:/kea/ca.crt:ro
      - ./tls/dhcp-2:/kea/tls:ro
      - leases-2:/kea/leases
    networks:
      kea-testing:
        ipv4_address: 10.10.10.3

  # Start a separate container on the same network where you can attach and run
  # tests from. Example:
  # docker exec -it high-availability-dhcp-tester-1 nmap --script broadcast-dhcp-discover
  dhcp-tester:
    image: jonasal/network-tools:latest
    init: true
    restart: unless-stopped
    networks:
      kea-testing:
        ipv4_address: 10.10.10.4
    command: ["sh", "-c", "echo \"Starting tester container\" && exec sleep infinity"]


volumes: # Remove with `docker compose down --volumes`
  leases-1:
  leases-2:

# Specify a network we hope will not interfere with anything else on the
# machine used for testing.
networks:
  kea-testing:
    driver: bridge
    ipam:
     config:
       - subnet: 10.10.10.0/24
         gateway: 10.10.10.1
